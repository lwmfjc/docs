{{ $cssMap :=  dict "book01" "css/book01.css"  "book02" "css/book02.css"   "book03" "css/book03.css"  }}
{{/*获取md中指定的样式*/}}
{{ $cssArr := .Param "cssAttach" }}
{{ range $v := $cssArr }} 
	{{ $cssHref := (index $cssMap $v) }} 
	{{ if $cssHref }} 
		<link type=text/css rel="stylesheet" href="{{ $cssHref }}">
	{{ end }} 
{{ end }}

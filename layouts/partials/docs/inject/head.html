{{ $cssMap :=  dict "book" "/css/book.css"  "book-zztj" "/css/book-zztj.css"  }}
{{/*获取md中指定的样式*/}}
{{ $cssArr := .Param "cssAttach" }}
{{ range $v := $cssArr }}
	{{ if $v }}
		{{ $cssHref := (index $cssMap $v) }} 
		{{ if and $cssHref }} 
			<link type=text/css rel="stylesheet" href="{{ $cssHref }}">
		{{ end }}
	{{ end }}
{{ end }}

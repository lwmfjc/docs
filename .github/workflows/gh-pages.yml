name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

# 必须显式声明官方部署所需的特殊权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache Hugo Modules
        uses: actions/cache@v4
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum', '**/hugo.toml', '**/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Read .env
        id: hugo-version
        run: |
          if [ -f .env ]; then
            . ./.env
            echo "HUGO_VERSION=${HUGO_VERSION}" >> "${GITHUB_OUTPUT}"
          else
            echo "HUGO_VERSION=latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '${{ steps.hugo-version.outputs.HUGO_VERSION }}'
          extended: true
          
      - name: Build
        run: hugo --minify 

      # ===== 以下是核心修改：改用官方原生无 Git 部署 =====
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4